title: OnSite Documentation
description: User guides for OnSite — the field management app for tradespeople.
url: "https://docs.onsite-trades.com"
baseurl: ""

remote_theme: just-the-docs/just-the-docs@v0.10.1

color_scheme: light

# Logo & favicon — uncomment and add logo.png to assets/images/ when ready
# logo: "/assets/images/logo.png"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Aux links in header
aux_links:
  "App Store":
    - "https://apps.apple.com/app/onsite"

aux_links_new_tab: true

# Footer
footer_content: "Copyright &copy; 2026 Nathan Manley. All rights reserved."

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Last edit timestamp
last_edit_time_format: "%b %e %Y"

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme

exclude:
  - CLAUDE.md
  - claude.md
  - Gemfile
  - Gemfile.lock
  - vendor
